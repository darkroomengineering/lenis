<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lenis 315 device test</title>
    <style>
      /* lenis.css (v1) */
      html.lenis,
      html.lenis body {
        height: auto;
      }
      .lenis:not(.lenis-autoToggle).lenis-stopped {
        overflow: clip;
      }
      body {
        margin: 0;
        font: 13px/1.35 ui-monospace, Menlo, monospace;
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgb(255 255 255 / 0.92);
        color: #111;
        padding: 6px 10px;
        z-index: 10;
        pointer-events: none;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #hud.big {
        font: 600 17px/1.3 system-ui, sans-serif;
        padding: 10px 12px 14px;
      }
      #hud.running {
        background: #ffe14d;
      }
      #hud.done {
        background: #58d68d;
      }
      #content {
        position: relative;
        height: 12000px;
        background: repeating-linear-gradient(#eef3ff 0 200px, #ffeef3 200px 400px);
      }
      .mark {
        position: absolute;
        left: 8px;
        font-size: 28px;
        color: #556;
      }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="content"></div>
    <script type="module">
      // ?build=main|v2|…  &touch=native|smooth  &case=…  &interrupt=…  &manual=1
      const q = new URLSearchParams(location.search)
      // by-hand sequence: ?seq=0 walks through SEQ, one case per page load
      const SEQ = [
        ['main-hold', 'native', 'lock-during-pan', 'none'],
        ['v2-hold', 'native', 'lock-during-pan', 'none'],
        ['main-hold', 'native', 'lock-during-pan', 'none'],
        ['v2-hold', 'native', 'lock-during-pan', 'none'],
        ['main-hold', 'smooth', 'lock-during-pan', 'none'],
        ['main-hold', 'native', 'lock-before-move', 'none'],
        ['main-hold', 'native', 'lock-during-momentum', 'none'],
        ['main', 'native', 'lock-during-pan', 'both-hidden'],
        ['main', 'native', 'native-smooth-during-pan', 'none'],
      ]
      const seq = q.has('seq') ? Number(q.get('seq')) : null
      const session = q.get('session') || String(Date.now())
      if (seq !== null && seq >= SEQ.length) {
        document.getElementById('hud').className = 'big done'
        document.getElementById('hud').textContent = 'ALL DONE, thank you'
        throw new Error('sequence finished')
      }
      const preset = seq !== null ? SEQ[seq] : null
      const build = preset?.[0] ?? (q.get('build') || 'main')
      const touch = preset?.[1] ?? (q.get('touch') || 'native')
      const kase = preset?.[2] ?? (q.get('case') || 'lock-during-pan')
      const interrupt = preset?.[3] ?? (q.get('interrupt') || 'none')
      const run = q.get('run') || ''
      const isV2 = build.startsWith('v2')
      const isHold = build.endsWith('-hold')

      const START = 3000
      const TARGET = 6000
      const DURATION = 2 // s, linear

      const hud = document.getElementById('hud')
      const content = document.getElementById('content')
      const root = document.documentElement
      for (let y = 0; y < 12000; y += 200) {
        const mark = document.createElement('div')
        mark.className = 'mark'
        mark.style.top = `${y}px`
        mark.textContent = y
        content.append(mark)
      }

      history.scrollRestoration = 'manual'
      window.scrollTo(0, START)

      const { default: Lenis } = await import(`./builds/lenis-${build}.js`)
      // raf is driven below, so each frame can be sampled before and after Lenis
      const lenis = isV2
        ? new Lenis({ autoRaf: false, touch: { smooth: touch === 'smooth' } })
        : new Lenis({ autoRaf: false, syncTouch: touch === 'smooth' })
      window.lenis = lenis

      const state = {
        build,
        touch,
        case: kase,
        interrupt,
        run,
        seq,
        session,
        ua: navigator.userAgent,
        t0: null, // first touchstart
        tTrigger: null,
        tComplete: null,
        tTouchEnd: null,
        interruptAppliedAt: null,
        interruptRestoredAt: null,
        scrollToResult: undefined,
      }
      const frames = [] // [t, pre, post, animated, locked, isScrolling]
      const scrolls = [] // [t, scrollY]
      const touches = [] // [t, type, clientY, cancelable, defaultPrevented]
      const now = () => Math.round(performance.now() * 10) / 10
      const y = () => Math.round(window.scrollY * 10) / 10

      let prevPost = y()
      function loop(time) {
        const pre = y()
        lenis.raf(time)
        const post = y()
        if (state.t0 !== null && frames.length < 4000) {
          frames.push([
            now(),
            pre,
            post,
            Math.round((lenis.animatedScroll ?? lenis.scroll) * 10) / 10,
            lenis.isLocked ? 1 : 0,
            String(lenis.isScrolling),
            Math.round((pre - prevPost) * 10) / 10,
          ])
        }
        prevPost = post
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)

      window.addEventListener(
        'scroll',
        () => {
          if (state.t0 !== null && scrolls.length < 8000) scrolls.push([now(), y()])
        },
        { passive: true }
      )

      // ─── fix candidates, applied from the page ───
      let restoreInterrupt = null
      function applyInterrupt(kind) {
        if (restoreInterrupt) return
        state.interruptAppliedAt = now()
        const set = (el, prop, value) => {
          const prev = el.style.getPropertyValue(prop)
          el.style.setProperty(prop, value)
          return () => {
            if (prev) el.style.setProperty(prop, prev)
            else el.style.removeProperty(prop)
          }
        }
        let undo
        if (kind === 'hidden' || kind === 'hidden-frame' || kind === 'lockstart-hidden')
          undo = set(root, 'overflow', 'hidden')
        else if (kind === 'clip') undo = set(root, 'overflow', 'clip')
        else if (kind === 'body-hidden') undo = set(document.body, 'overflow', 'hidden')
        else if (kind === 'both-hidden') {
          const undoRoot = set(root, 'overflow', 'hidden')
          const undoBody = set(document.body, 'overflow', 'hidden')
          undo = () => {
            undoRoot()
            undoBody()
          }
        }
        else if (kind === 'touchaction') undo = set(root, 'touch-action', 'none')
        else return
        restoreInterrupt = () => {
          undo()
          restoreInterrupt = null
          state.interruptRestoredAt = now()
        }
        if (kind === 'hidden-frame') {
          requestAnimationFrame(() => requestAnimationFrame(() => restoreInterrupt?.()))
        }
      }

      // ─── the scrollTo under test ───
      function trigger() {
        if (state.tTrigger !== null) return
        state.tTrigger = now()
        state.yAtTrigger = y()
        if (seq !== null) {
          hud.className = 'big running'
          hud.textContent = `${label}\n${
            kase === 'lock-during-momentum'
              ? 'wait…'
              : isHold && touch === 'native' && kase === 'lock-during-pan'
                ? 'Keep dragging 2 more seconds, then LIFT your finger'
                : 'KEEP DRAGGING up and down'
          }`
        }
        if (kase === 'stop-during-pan') {
          // reference: v1 stop() puts `overflow: clip` on the root through lenis.css
          if (typeof lenis.stop === 'function') lenis.stop()
          else root.style.setProperty('overflow', 'clip')
          setTimeout(() => {
            if (typeof lenis.start === 'function') lenis.start()
            else root.style.removeProperty('overflow')
            state.tComplete = now()
            finish()
          }, 1500)
          return
        }
        if (kase === 'native-smooth-during-pan') {
          // the browser's own smooth scroll, no Lenis animation
          window.scrollTo({ top: TARGET, behavior: 'smooth' })
          setTimeout(() => {
            state.tComplete = now()
            finish()
          }, 2500)
          return
        }
        const lock = kase !== 'nolock-during-pan'
        if (interrupt === 'lockstart-hidden') applyInterrupt(interrupt)
        const result = lenis.scrollTo(TARGET, {
          lock,
          duration: DURATION,
          easing: (t) => t,
          onComplete: () => {
            state.tComplete = now()
            if (interrupt === 'lockstart-hidden') restoreInterrupt?.()
            finish()
          },
        })
        if (result && typeof result.then === 'function') {
          result.then((value) => {
            state.scrollToResult = value
          })
        }
        // if it never completes (cancelled), still report. A held scrollTo
        // only starts when the finger lifts, so count from there.
        const fallback = () => {
          const since = touchActive ? 0 : now() - Math.max(state.tTrigger, state.tTouchEnd ?? 0)
          if (since >= DURATION * 1000 + 1200 || now() - state.tTrigger > 20000) finish()
          else setTimeout(fallback, 300)
        }
        setTimeout(fallback, DURATION * 1000 + 1200)
      }

      let moves = 0
      let touchActive = false
      const onTouch = (event) => {
        const t = now()
        if (state.t0 === null) state.t0 = t
        const point = event.touches[0] ?? event.changedTouches[0]
        if (touches.length < 3000) {
          touches.push([
            t,
            event.type,
            point ? Math.round(point.clientY) : null,
            event.cancelable ? 1 : 0,
            event.defaultPrevented ? 1 : 0,
            lenis.isLocked ? 1 : 0,
          ])
        }

        if (event.type === 'touchstart') touchActive = true
        if (event.type === 'touchend' || event.type === 'touchcancel') {
          touchActive = event.touches.length > 0
          if (isHold && state.tTrigger !== null && seq !== null && !finished) {
            hud.textContent = `${label}\nWATCH: it should now scroll to 6000`
          }
        }
        if (event.type === 'touchstart') {
          if (kase === 'lock-before-move') setTimeout(trigger, 200)
          if (kase === 'control') setTimeout(finish, 4500)
        }
        if (event.type === 'touchmove') {
          moves++
          if (
            moves === 6 &&
            (kase === 'lock-during-pan' ||
              kase === 'nolock-during-pan' ||
              kase === 'native-smooth-during-pan' ||
              kase === 'stop-during-pan')
          )
            trigger()
          if (
            lenis.isLocked &&
            !event.cancelable &&
            ['hidden', 'clip', 'hidden-frame', 'body-hidden', 'both-hidden', 'touchaction'].includes(interrupt)
          )
            applyInterrupt(interrupt)
        }
        if (event.type === 'touchend' || event.type === 'touchcancel') {
          state.tTouchEnd = t
          if (interrupt !== 'lockstart-hidden' && interrupt !== 'hidden-frame')
            restoreInterrupt?.()
          if (kase === 'lock-during-momentum') setTimeout(trigger, 60)
        }
      }
      // registered after Lenis on the same target, so it sees what Lenis did
      for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
        window.addEventListener(type, onTouch, { passive: true })
      }

      // ─── report ───
      function report(full = false) {
        const from = state.tTrigger ?? state.t0 ?? 0
        const to = state.tComplete ?? from + DURATION * 1000 + 600
        const inWindow = frames.filter((f) => f[0] >= from && f[0] <= to)
        // a frame where the page moved between Lenis's last write and this
        // frame's start: something else (the native pan) scrolled it
        const fights = inWindow.filter((f) => Math.abs(f[6]) > 2)
        const scrollsIn = scrolls.filter((s) => s[0] >= from && s[0] <= to)
        let reversals = 0
        let lastSign = 0
        for (let i = 1; i < scrollsIn.length; i++) {
          const d = scrollsIn[i][1] - scrollsIn[i - 1][1]
          if (Math.abs(d) < 3) continue
          const sign = Math.sign(d)
          if (lastSign && sign !== lastSign) reversals++
          lastSign = sign
        }
        const movesIn = touches.filter(
          (t) => t[1] === 'touchmove' && t[0] >= from && t[0] <= to
        )
        // conflict: Lenis wrote this frame and the one before, yet the page
        // sat far from where Lenis left it (50 px: above the one-frame
        // read-back lag iOS shows at this speed, about 25 px)
        let conflictFrames = 0
        let maxConflictPx = 0
        let writeFrames = 0
        for (let i = 1; i < inWindow.length; i++) {
          const wrote = Math.abs(inWindow[i][2] - inWindow[i][1]) > 0.5
          const wrotePrev = Math.abs(inWindow[i - 1][2] - inWindow[i - 1][1]) > 0.5
          if (wrote) writeFrames++
          if (wrote && wrotePrev && Math.abs(inWindow[i][6]) > 50) {
            conflictFrames++
            maxConflictPx = Math.max(maxConflictPx, Math.abs(inWindow[i][6]))
          }
        }
        const summary = {
          ...state,
          writeFrames,
          conflictFrames,
          maxConflictPx,
          yFinal: y(),
          yAtFirstTouch: frames[0]?.[1],
          framesInWindow: inWindow.length,
          fightFrames: fights.length,
          maxFightPx: fights.reduce((m, f) => Math.max(m, Math.abs(f[6])), 0),
          scrollEventsInWindow: scrollsIn.length,
          scrollReversals: reversals,
          touchmovesTotal: touches.filter((t) => t[1] === 'touchmove').length,
          touchmovesInWindow: movesIn.length,
          touchmovesInWindowNotCancelable: movesIn.filter((t) => !t[3]).length,
          touchmovesInWindowPrevented: movesIn.filter((t) => t[4]).length,
          touchmovesBeforeNotCancelable: touches.filter(
            (t) => t[1] === 'touchmove' && t[0] < from && !t[3]
          ).length,
          lockedAtEnd: lenis.isLocked ? 1 : 0,
          rootOverflowAtEnd: getComputedStyle(root).overflow,
          rootClass: root.className,
        }
        if (!full) {
          // frames: [t, yBeforeLenis, yAfterLenis, animatedScroll, locked, isScrolling, movedSinceLastFrame]
          summary.frameSample = inWindow.filter((_, i) => i % 6 === 0).slice(0, 30)
          summary.scrollSample = scrollsIn.slice(0, 60)
          return summary
        }
        return { summary, frames, scrolls, touches }
      }
      window.__report = report

      let finished = false
      function finish() {
        if (finished) return
        finished = true
        // let the trace run a little past the end
        setTimeout(() => {
          const summary = report()
          window.__done = true
          hud.textContent =
            `${build} · touch=${touch} · ${kase} · interrupt=${interrupt}\n` +
            `DONE conflict=${summary.conflictFrames} max=${summary.maxConflictPx}px fightFrames=${summary.fightFrames}/${summary.framesInWindow} ` +
            `maxFight=${summary.maxFightPx}px reversals=${summary.scrollReversals} ` +
            `nonCancelable=${summary.touchmovesInWindowNotCancelable}/${summary.touchmovesInWindow} ` +
            `yFinal=${summary.yFinal} completed=${state.tComplete !== null}`
          const posted = fetch('./report', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(report(true)),
          }).catch(() => {})
          if (seq !== null) {
            hud.className = 'big done'
            hud.textContent = `${label}\nDONE, lift your finger`
            posted.then(() =>
              setTimeout(() => {
                location.href = `./?seq=${seq + 1}&session=${session}`
              }, 2000)
            )
          }
        }, 500)
      }

      const label =
        seq !== null
          ? `${seq + 1}/${SEQ.length} · ${build} · ${touch} · ${kase} · ${interrupt}`
          : ''

      hud.textContent =
        `${build} · touch=${touch} · ${kase} · interrupt=${interrupt}\n` +
        'READY: put a finger down and keep dragging up and down slowly for 4 s'
      if (seq !== null) {
        hud.className = 'big'
        hud.textContent =
          `${label}\n` +
          (kase === 'lock-before-move'
            ? 'Touch and HOLD STILL until this turns yellow, then drag up and down'
            : kase === 'lock-during-momentum'
              ? 'FLICK up once, hard, and let go'
              : isHold && touch === 'native' && kase === 'lock-during-pan'
                ? 'DRAG up and down slowly. When this turns yellow, drag 2 more seconds, then LIFT'
                : 'Put a finger down and DRAG up and down slowly, without stopping, until this turns green')
      }
      window.__ready = true
    </script>
  </body>
</html>
