name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image ships the browsers and their system packages. Its version must
    # match the `playwright` version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      # Firefox does not start as root in the runner's home directory
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: lts
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Format, lint and types
        run: vp check

      - name: Build
        run: vp pack

      - name: Test
        run: vp test run

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-screenshots
          path: .vitest/attachments
          if-no-files-found: ignore
